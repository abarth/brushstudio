<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>brushstudio</title>
    <link rel="stylesheet" href="/web/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%96%8C</text></svg>"
    />
  </head>
  <body>
    <header>
      <h1>brushstudio</h1>
      <details id="menu" class="pop">
        <summary aria-label="menu" title="menu">&#9776;</summary>
        <div class="sheet">
          <button id="clear">Clear canvas</button>
          <button id="save">Save PNG</button>
          <label class="check"><input type="checkbox" id="erase" /> erase</label>
          <label class="check"><input type="checkbox" id="dark" /> dark ground</label>
        </div>
      </details>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <p id="status"></p>
      <aside>
        <details id="library" class="pop">
          <summary>
            <span id="brushname">brush</span>
            <span id="count"></span>
          </summary>
          <div class="sheet">
            <input
              id="search"
              type="search"
              placeholder="filter brushes"
              autocomplete="off"
              spellcheck="false"
            />
            <ul id="brushes"></ul>
          </div>
        </details>
        <nav id="rail"></nav>
        <div id="controls"></div>
        <pre id="patch" hidden></pre>
        <footer id="bar">
          <p id="hint"></p>
          <div class="acts">
            <span id="changes"></span>
            <button id="revert" title="put every value back the way the document had it">revert</button>
            <button id="showpatch" title="the settings patch this brush would be saved as">patch</button>
            <button id="copy" title="copy the patch, ready to paste into the brush document">copy</button>
          </div>
        </footer>
      </aside>
    </main>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
