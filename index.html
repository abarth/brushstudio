<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>brushstudio</title>
    <link rel="stylesheet" href="/web/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%96%8C</text></svg>"
    />
  </head>
  <body>
    <header>
      <h1>brushstudio</h1>
      <details id="menu">
        <summary aria-label="menu" title="menu">&#9776;</summary>
        <div class="sheet">
          <button id="clear">Clear canvas</button>
          <button id="save">Save PNG</button>
          <label class="check"><input type="checkbox" id="erase" /> erase</label>
          <label class="check"><input type="checkbox" id="dark" /> dark ground</label>
        </div>
      </details>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <p id="status"></p>
      <aside>
        <section id="library">
          <div class="find">
            <input
              id="search"
              type="search"
              placeholder="filter brushes"
              autocomplete="off"
              spellcheck="false"
            />
            <span id="count"></span>
          </div>
          <ul id="brushes"></ul>
        </section>
        <div id="controls"></div>
        <section id="patchbox">
          <div class="head">settings patch <button id="copy">Copy</button></div>
          <pre id="patch"></pre>
        </section>
      </aside>
    </main>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
